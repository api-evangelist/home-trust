name: Home Trust
kind: company
description: >-
  Home Trust Company is a federally regulated Canadian trust company founded in
  1977 and headquartered in Toronto, and the principal operating subsidiary of
  Home Capital Group. Home Capital was taken private by Smith Financial
  Corporation (Stephen Smith) in 2023, and the group now spans Home Trust, Home
  Bank (a Schedule I bank), Fairstone Bank, and the Oaken Financial deposit
  brand, positioning itself as one of Canada's leading alternative (non-prime)
  lenders. Its products include residential and commercial mortgages, reverse
  mortgages, Equityline, Preferred and Secured Visa credit cards, and Oaken GIC
  and high-interest savings deposits. Home Trust operates no public developer
  portal or first-party API: developer.hometrust.ca and api.hometrust.ca do not
  resolve (DNS NXDOMAIN), no downloadable OpenAPI/Swagger is published, and no
  Interac e-Transfer or Payments Canada Real-Time Rail (RTR) API surface is
  documented. Canada's federal Consumer-Driven Banking (open-banking) framework
  is legislated (Budget 2024 / Fall Economic Statement 2024, FCAC as overseer)
  but not yet operational, and Home Trust publishes no stated CDB or FDX
  position; any consumer data access today would be via screen-scraping
  aggregators such as Flinks or Plaid rather than a first-party API. This is an
  identity-only record: no public API exists as of July 2026.
