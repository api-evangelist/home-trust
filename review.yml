aid: home-trust
name: Home Trust
review:
  question: Does Home Trust Company expose a public first-party developer portal or API?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Home Trust Company (the principal operating subsidiary of Home Capital
    Group, taken private by Smith Financial Corporation in 2023) publishes no
    public developer portal and no first-party API. It is a federally regulated
    Canadian trust company and alternative (non-prime) lender whose group now
    includes Home Bank (a Schedule I bank), Fairstone Bank, and the Oaken
    Financial deposit brand. Direct probes on 2026-07-23 found no developer or
    API host, no downloadable OpenAPI/Swagger specification, and no documented
    Interac or Payments Canada Real-Time Rail (RTR) API surface. Canada's
    Consumer-Driven Banking framework is legislated but not yet operational, and
    Home Trust publishes no stated CDB or FDX position. There is no OAuth2/OIDC,
    API-key, or mTLS-secured public API to authenticate against because no
    public API is documented. Consistent with most Canadian alternative lenders,
    consumer financial-data access today would occur via screen-scraping
    aggregators (e.g., Flinks, Plaid), not a first-party API.
  postureFlags:
